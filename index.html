<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Splitter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="app"></div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // Wait for Firebase to load
        function initWhenReady() {
            if (typeof firebase === 'undefined') {
                console.log('Waiting for Firebase...');
                setTimeout(initWhenReady, 100);
                return;
            }
            
            console.log('Firebase loaded!');
            initApp();
        }

        function initApp() {
        // Initialize Firebase
        firebase.initializeApp({
            apiKey: "AIzaSyANplgQXh_UMoU29BOsMU1qihpLZaNz8D0",
            authDomain: "billsplitx.firebaseapp.com",
            databaseURL: "https://billsplitx-default-rtdb.firebaseio.com",
            projectId: "billsplitx",
            storageBucket: "billsplitx.firebasestorage.app",
            messagingSenderId: "970250474982",
            appId: "1:970250474982:web:860881a78820a315127227"
        });

        const db = firebase.database();
        
        // State
        let state = {
            groupId: '',
            groupInput: '',
            view: 'input', // 'input', 'loading', 'main'
            friends: [],
            expenses: [],
            payments: [], // Track actual payments made
            showAddFriend: false,
            showAddExpense: false,
            showSettlement: false,
            showRecordPayment: false,
            newFriendName: '',
            expenseForm: { 
                desc: '', 
                amount: '', 
                payer: '', 
                participants: new Set(),
                splitType: 'equal', // 'equal', 'percentage', 'custom'
                splits: {} // { friendId: amount/percentage }
            }
        };

        // Render function
        function render() {
            const app = document.getElementById('app');
            
            if (state.view === 'input') {
                app.innerHTML = `
                    <div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 flex items-center justify-center">
                        <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full">
                            <div class="text-center mb-6">
                                <h1 class="text-3xl font-bold text-indigo-600 mb-2">💰 Bill Splitter</h1>
                                <p class="text-gray-600">Create or join a group</p>
                            </div>
                            <input id="groupInput" type="text" value="${state.groupInput}" 
                                placeholder="Enter Group ID" maxlength="10"
                                class="w-full px-4 py-3 border rounded-lg mb-3 text-center text-lg font-mono uppercase">
                            <button onclick="joinGroup()" class="w-full bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 mb-3 font-semibold">
                                Join / Create Group
                            </button>
                            <button onclick="generateId()" class="w-full bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 font-semibold">
                                + Generate New ID
                            </button>
                        </div>
                    </div>
                `;
                
                document.getElementById('groupInput').addEventListener('input', (e) => {
                    state.groupInput = e.target.value.toUpperCase();
                });
                
                document.getElementById('groupInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') joinGroup();
                });
                
            } else if (state.view === 'loading') {
                app.innerHTML = `
                    <div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 flex items-center justify-center">
                        <div class="text-center">
                            <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-indigo-600 mx-auto mb-4"></div>
                            <p class="text-gray-600">Loading: ${state.groupId}</p>
                            <button onclick="leaveGroup()" class="mt-4 text-sm text-indigo-600 hover:text-indigo-800">Cancel</button>
                        </div>
                    </div>
                `;
                
            } else {
                renderMainApp();
            }
        }

        function renderMainApp() {
            const balances = calculateBalances();
            const settlements = calculateSettlements(balances);
            
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                    <div class="max-w-4xl mx-auto">
                        <!-- Header -->
                        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <div class="flex justify-between mb-4">
                                <h1 class="text-3xl font-bold text-indigo-600">💰 Bill Splitter</h1>
                                <button onclick="leaveGroup()" class="text-red-600 text-sm hover:text-red-700">Leave</button>
                            </div>
                            <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-4">
                                <div class="flex justify-between items-center">
                                    <div>
                                        <p class="text-sm text-indigo-700">Group ID</p>
                                        <p class="text-2xl font-mono font-bold text-indigo-900">${state.groupId}</p>
                                    </div>
                                    <button onclick="copyGroupId()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
                                        📋 Copy
                                    </button>
                                </div>
                                <p class="text-sm text-indigo-600 mt-2">📤 Share this ID with friends</p>
                            </div>
                        </div>

                        <!-- Summary Statistics -->
                        <div class="bg-gradient-to-r from-indigo-50 to-blue-50 rounded-lg shadow-lg p-6 mb-6 border border-indigo-200">
                            <h2 class="text-xl font-semibold mb-4 text-indigo-900">📊 Trip Summary</h2>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                                <div class="bg-white rounded-lg p-4">
                                    <p class="text-sm text-gray-600">Total Trip Cost</p>
                                    <p class="text-2xl font-bold text-indigo-600">$${state.expenses.reduce((sum, e) => sum + e.amount, 0).toFixed(2)}</p>
                                </div>
                                <div class="bg-white rounded-lg p-4">
                                    <p class="text-sm text-gray-600">Average Per Person</p>
                                    <p class="text-2xl font-bold text-green-600">$${state.friends.length > 0 ? (state.expenses.reduce((sum, e) => sum + e.amount, 0) / state.friends.length).toFixed(2) : '0.00'}</p>
                                </div>
                                <div class="bg-white rounded-lg p-4">
                                    <p class="text-sm text-gray-600">Number of Expenses</p>
                                    <p class="text-2xl font-bold text-blue-600">${state.expenses.length}</p>
                                </div>
                            </div>
                            
                            <div class="bg-white rounded-lg p-4">
                                <p class="text-sm font-semibold text-gray-800 mb-3">💰 How Much Each Person Spent:</p>
                                <div class="space-y-2">
                                    ${state.friends.map(f => {
                                        const totalSpent = state.expenses
                                            .filter(exp => exp.payerId === f.id)
                                            .reduce((sum, exp) => sum + exp.amount, 0);
                                        return `
                                            <div class="flex justify-between items-center p-2 bg-gray-50 rounded">
                                                <span class="font-medium">${f.name}</span>
                                                <span class="font-bold text-indigo-600">$${totalSpent.toFixed(2)}</span>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>

                        <!-- Friends -->
                        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <div class="flex justify-between mb-4">
                                <h2 class="text-xl font-semibold">👥 Friends (${state.friends.length})</h2>
                                <button onclick="toggleAddFriend()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">+</button>
                            </div>
                            ${state.showAddFriend ? `
                                <div class="mb-4 flex gap-2">
                                    <input id="newFriendInput" type="text" placeholder="Name" 
                                        class="flex-1 px-4 py-2 border rounded-lg">
                                    <button onclick="addFriend()" class="bg-green-600 text-white px-4 py-2 rounded-lg">✓</button>
                                    <button onclick="toggleAddFriend()" class="bg-gray-400 text-white px-4 py-2 rounded-lg">✕</button>
                                </div>
                            ` : ''}
                            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2">
                                ${state.friends.map(f => {
                                    const bal = balances[f.id] || 0;
                                    return `
                                        <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg text-sm">
                                            <div class="flex-1 min-w-0">
                                                <div class="font-medium truncate">${f.name}</div>
                                                <div class="text-xs ${bal > 0.01 ? 'text-green-600' : bal < -0.01 ? 'text-red-600' : 'text-gray-600'}">
                                                    $${Math.abs(bal).toFixed(2)}
                                                </div>
                                            </div>
                                            <button onclick="removeFriend('${f.id}')" class="text-red-500 hover:text-red-700 ml-1">✕</button>
                                        </div>
                                    `;
                                }).join('')}
                                ${state.friends.length === 0 ? '<p class="col-span-full text-gray-500 text-center py-8">Add friends to start!</p>' : ''}
                            </div>
                        </div>

                        <!-- Expenses -->
                        ${state.friends.length > 0 ? `
                            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                                <div class="flex justify-between mb-4">
                                    <h2 class="text-xl font-semibold">💸 Expenses (${state.expenses.length})</h2>
                                    <button onclick="toggleAddExpense()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">+</button>
                                </div>
                                ${state.showAddExpense ? `
                                    <div class="mb-4 bg-gray-50 p-4 rounded-lg">
                                        <input id="expDesc" type="text" placeholder="Description" class="w-full px-4 py-2 border rounded-lg mb-2">
                                        <input id="expAmount" type="number" step="0.01" placeholder="Amount" class="w-full px-4 py-2 border rounded-lg mb-2">
                                        <select id="expPayer" class="w-full px-4 py-2 border rounded-lg mb-2">
                                            <option value="">Who paid?</option>
                                            ${state.friends.map(f => `<option value="${f.id}">${f.name}</option>`).join('')}
                                        </select>
                                        
                                        <div class="mb-2">
                                            <label class="text-sm font-medium mb-1 block">Split Type:</label>
                                            <select id="splitType" onchange="updateSplitType()" class="w-full px-4 py-2 border rounded-lg mb-2">
                                                <option value="equal">Equal Split</option>
                                                <option value="percentage">Percentage Split</option>
                                                <option value="custom">Custom Amounts</option>
                                            </select>
                                        </div>

                                        <div class="mb-2">
                                            <div class="flex justify-between items-center mb-1">
                                                <p class="text-sm font-medium">Split between:</p>
                                                <button onclick="selectAllParticipants()" type="button" class="text-xs text-indigo-600 hover:text-indigo-800">
                                                    Select All
                                                </button>
                                            </div>
                                            <div id="participants" class="border rounded-lg p-2 max-h-48 overflow-y-auto">
                                                ${state.friends.map(f => `
                                                    <div class="flex items-center gap-2 mb-2">
                                                        <label class="flex items-center gap-1 flex-1">
                                                            <input type="checkbox" value="${f.id}" class="participant-check" onchange="updateParticipantSplit()">
                                                            <span class="text-sm">${f.name}</span>
                                                        </label>
                                                        <input type="number" 
                                                            step="0.01" 
                                                            id="split-${f.id}" 
                                                            placeholder="${state.expenseForm.splitType === 'percentage' ? '%' : '$'}" 
                                                            class="split-input w-20 px-2 py-1 border rounded text-sm" 
                                                            oninput="updateParticipantSplit()"
                                                            style="display: none;">
                                                    </div>
                                                `).join('')}
                                            </div>
                                            <div id="splitWarning" class="text-xs text-amber-600 mt-1" style="display: none;"></div>
                                        </div>

                                        <div class="flex gap-2">
                                            <button onclick="addExpense()" class="flex-1 bg-green-600 text-white px-4 py-2 rounded-lg">Add</button>
                                            <button onclick="toggleAddExpense()" class="bg-gray-400 text-white px-4 py-2 rounded-lg">Cancel</button>
                                        </div>
                                    </div>
                                ` : ''}
                                <div class="space-y-2">
                                    ${state.expenses.slice().reverse().map(exp => {
                                        return `
                                        <div class="bg-gray-50 p-3 rounded-lg border-l-4 border-indigo-500">
                                            <div class="flex justify-between items-start mb-2">
                                                <div class="flex-1">
                                                    <div class="font-semibold">${exp.description}</div>
                                                    <div class="text-sm text-gray-600">${getFriendName(exp.payerId)} paid $${exp.amount.toFixed(2)}</div>
                                                </div>
                                                <button onclick="removeExpense('${exp.id}')" class="text-red-500 hover:text-red-700 text-lg">✕</button>
                                            </div>
                                            <button onclick="toggleExpDetails('${exp.id}')" class="text-xs text-indigo-600 hover:text-indigo-800 w-full text-left py-1 px-2 rounded hover:bg-indigo-50 transition">
                                                📋 View split details
                                            </button>
                                            <div id="exp-details-${exp.id}" class="mt-2 hidden bg-white p-2 rounded border border-indigo-200">
                                                <p class="text-xs font-semibold text-gray-800 mb-2">Split Type: <span class="capitalize">${exp.splitType || 'equal'}</span></p>
                                                <div class="space-y-1">
                                                    ${exp.participantIds.map(id => {
                                                        const amount = exp.splits?.[id] || (exp.amount / exp.participantIds.length);
                                                        return `<div class="flex justify-between text-xs py-1 px-2 bg-gray-50 rounded">
                                                            <span class="font-medium">${getFriendName(id)}</span>
                                                            <span class="font-semibold text-indigo-600">$${amount.toFixed(2)}</span>
                                                        </div>`;
                                                    }).join('')}
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                    }).join('')}
                                    ${state.expenses.length === 0 ? '<p class="text-gray-500 text-center py-8">No expenses yet.</p>' : ''}
                                </div>
                            </div>
                        ` : ''}

                        <!-- Settlement -->
                        ${state.friends.length > 0 && state.expenses.length > 0 ? `
                            <div class="bg-white rounded-lg shadow-lg p-6">
                                <div class="flex justify-between items-center mb-4">
                                    <h2 class="text-xl font-semibold">Settle Up</h2>
                                    <div class="flex gap-2">
                                        <button onclick="toggleRecordPayment()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm">
                                            Record Payment
                                        </button>
                                        <button onclick="toggleSettlement()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-sm">
                                            ${state.showSettlement ? 'Hide' : 'Show'} Plan
                                        </button>
                                    </div>
                                </div>

                                ${state.showRecordPayment ? `
                                    <div class="mb-4 bg-blue-50 p-4 rounded-lg border border-blue-200">
                                        <h3 class="font-semibold text-blue-900 mb-3">Record a Payment</h3>
                                        <select id="paymentFrom" class="w-full px-4 py-2 border rounded-lg mb-2">
                                            <option value="">Who paid?</option>
                                            ${state.friends.map(f => `<option value="${f.id}">${f.name}</option>`).join('')}
                                        </select>
                                        <select id="paymentTo" class="w-full px-4 py-2 border rounded-lg mb-2">
                                            <option value="">To whom?</option>
                                            ${state.friends.map(f => `<option value="${f.id}">${f.name}</option>`).join('')}
                                        </select>
                                        <input id="paymentAmount" type="number" step="0.01" placeholder="Amount" 
                                            class="w-full px-4 py-2 border rounded-lg mb-2">
                                        <div class="flex gap-2">
                                            <button onclick="recordPayment()" class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                                                Save Payment
                                            </button>
                                            <button onclick="toggleRecordPayment()" class="bg-gray-400 text-white px-4 py-2 rounded-lg">
                                                Cancel
                                            </button>
                                        </div>
                                    </div>
                                ` : ''}

                                ${state.payments.length > 0 ? `
                                    <div class="mb-4">
                                        <h3 class="font-semibold text-gray-700 mb-2 text-sm">💸 Payment History</h3>
                                        <div class="space-y-1 max-h-32 overflow-y-auto">
                                            ${state.payments.slice().reverse().map(payment => `
                                                <div class="flex justify-between items-center bg-blue-50 p-2 rounded text-sm">
                                                    <span>${getFriendName(payment.from)} → ${getFriendName(payment.to)}: <strong>$${payment.amount.toFixed(2)}</strong></span>
                                                    <button onclick="removePayment('${payment.id}')" class="text-red-500 hover:text-red-700 text-xs">✕</button>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}

                                ${state.showSettlement ? `
                                    <div class="bg-green-50 p-4 rounded-lg">
                                        <h3 class="font-semibold mb-2 text-green-800">Suggested Settlements</h3>
                                        ${settlements.length === 0 ? '<p class="text-green-700">All settled! 🎉</p>' : `
                                            <div class="space-y-2">
                                                ${settlements.map(s => `
                                                    <div class="bg-white p-3 rounded border-l-4 border-green-500">
                                                        <p>${getFriendName(s.from)} → ${getFriendName(s.to)}</p>
                                                        <p class="text-2xl font-bold text-green-600">$${s.amount.toFixed(2)}</p>
                                                    </div>
                                                `).join('')}
                                            </div>
                                        `}
                                    </div>
                                ` : ''}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Actions - Make globally accessible
        window.generateId = function() {
            state.groupInput = Math.random().toString(36).substring(2, 8).toUpperCase();
            render();
        }

        window.joinGroup = function() {
            if (state.groupInput.trim()) {
                state.groupId = state.groupInput.trim();
                state.view = 'loading';
                localStorage.setItem('billSplitterGroupId', state.groupId);
                render();
                setupListeners();
            }
        }

        window.leaveGroup = function() {
            state = {
                groupId: '',
                groupInput: '',
                view: 'input',
                friends: [],
                expenses: [],
                payments: [],
                showAddFriend: false,
                showAddExpense: false,
                showSettlement: false,
                showRecordPayment: false,
                newFriendName: '',
                expenseForm: { 
                    desc: '', 
                    amount: '', 
                    payer: '', 
                    participants: new Set(),
                    splitType: 'equal',
                    splits: {}
                }
            };
            localStorage.removeItem('billSplitterGroupId');
            render();
        }

        function setupListeners() {
            const friendsRef = db.ref(`groups/${state.groupId}/friends`);
            const expensesRef = db.ref(`groups/${state.groupId}/expenses`);
            const paymentsRef = db.ref(`groups/${state.groupId}/payments`);

            friendsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                state.friends = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
                state.view = 'main';
                render();
            });

            expensesRef.on('value', (snapshot) => {
                const data = snapshot.val();
                state.expenses = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
                if (state.view === 'main') render();
            });

            paymentsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                state.payments = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
                if (state.view === 'main') render();
            });
        }

        function copyGroupId() {
            navigator.clipboard.writeText(state.groupId);
            alert('Copied!');
        }
        window.copyGroupId = copyGroupId;

        function toggleAddFriend() {
            state.showAddFriend = !state.showAddFriend;
            render();
            if (state.showAddFriend) {
                setTimeout(() => document.getElementById('newFriendInput').focus(), 100);
            }
        }
        window.toggleAddFriend = toggleAddFriend;

        function addFriend() {
            const input = document.getElementById('newFriendInput');
            const name = input.value.trim();
            if (name) {
                db.ref(`groups/${state.groupId}/friends`).push().set({
                    name: name,
                    createdAt: Date.now()
                });
                state.showAddFriend = false;
            }
        }
        window.addFriend = addFriend;

        function removeFriend(id) {
            db.ref(`groups/${state.groupId}/friends/${id}`).remove();
            state.expenses.forEach(exp => {
                if (exp.payerId === id || exp.participantIds.includes(id)) {
                    db.ref(`groups/${state.groupId}/expenses/${exp.id}`).remove();
                }
            });
        }
        window.removeFriend = removeFriend;

        function toggleAddExpense() {
            state.showAddExpense = !state.showAddExpense;
            state.expenseForm = { 
                desc: '', 
                amount: '', 
                payer: '', 
                participants: new Set(),
                splitType: 'equal',
                splits: {}
            };
            render();
        }
        window.toggleAddExpense = toggleAddExpense;

        function updateSplitType() {
            const splitType = document.getElementById('splitType').value;
            state.expenseForm.splitType = splitType;
            
            const splitInputs = document.querySelectorAll('.split-input');
            const checks = document.querySelectorAll('.participant-check:checked');
            
            if (splitType === 'equal') {
                splitInputs.forEach(input => input.style.display = 'none');
            } else {
                checks.forEach(check => {
                    const input = document.getElementById('split-' + check.value);
                    if (input) {
                        input.style.display = 'block';
                        input.placeholder = splitType === 'percentage' ? '%' : '$';
                    }
                });
            }
            
            updateParticipantSplit();
        }
        window.updateSplitType = updateSplitType;

        function updateParticipantSplit() {
            const splitType = document.getElementById('splitType')?.value || 'equal';
            const checks = document.querySelectorAll('.participant-check:checked');
            const amount = parseFloat(document.getElementById('expAmount')?.value || 0);
            const warning = document.getElementById('splitWarning');
            
            if (splitType === 'equal') {
                if (warning) warning.style.display = 'none';
                return;
            }
            
            let total = 0;
            checks.forEach(check => {
                const input = document.getElementById('split-' + check.value);
                if (input) {
                    const val = parseFloat(input.value || 0);
                    total += val;
                }
            });
            
            if (splitType === 'percentage') {
                if (warning) {
                    if (Math.abs(total - 100) > 0.01 && checks.length > 0) {
                        warning.textContent = `Total: ${total.toFixed(1)}% (should be 100%)`;
                        warning.style.display = 'block';
                    } else {
                        warning.style.display = 'none';
                    }
                }
            } else if (splitType === 'custom') {
                if (warning) {
                    if (Math.abs(total - amount) > 0.01 && checks.length > 0) {
                        warning.textContent = `Total: $${total.toFixed(2)} (should be $${amount.toFixed(2)})`;
                        warning.style.display = 'block';
                    } else {
                        warning.style.display = 'none';
                    }
                }
            }
        }
        window.updateParticipantSplit = updateParticipantSplit;

        function selectAllParticipants() {
            const checks = document.querySelectorAll('.participant-check');
            const allChecked = Array.from(checks).every(c => c.checked);
            
            checks.forEach(check => {
                check.checked = !allChecked;
            });
            
            updateParticipantSplit();
        }
        window.selectAllParticipants = selectAllParticipants;

        function addExpense() {
            const desc = document.getElementById('expDesc').value.trim();
            const amount = parseFloat(document.getElementById('expAmount').value);
            const payer = document.getElementById('expPayer').value;
            const checks = document.querySelectorAll('.participant-check:checked');
            const participants = Array.from(checks).map(c => c.value);
            const splitType = document.getElementById('splitType').value;

            if (!desc || !amount || !payer || participants.length === 0) {
                alert('Please fill in all fields and select at least one participant');
                return;
            }

            // Build splits object based on type
            const splits = {};
            
            if (splitType === 'equal') {
                const equalAmount = amount / participants.length;
                participants.forEach(id => {
                    splits[id] = equalAmount;
                });
            } else if (splitType === 'percentage') {
                let totalPct = 0;
                participants.forEach(id => {
                    const input = document.getElementById('split-' + id);
                    const pct = parseFloat(input.value || 0);
                    totalPct += pct;
                    splits[id] = (amount * pct) / 100;
                });
                
                if (Math.abs(totalPct - 100) > 0.01) {
                    alert('Percentages must add up to 100%');
                    return;
                }
            } else if (splitType === 'custom') {
                let totalCustom = 0;
                participants.forEach(id => {
                    const input = document.getElementById('split-' + id);
                    const customAmt = parseFloat(input.value || 0);
                    totalCustom += customAmt;
                    splits[id] = customAmt;
                });
                
                if (Math.abs(totalCustom - amount) > 0.01) {
                    alert(`Custom amounts must add up to $${amount.toFixed(2)}`);
                    return;
                }
            }

            db.ref(`groups/${state.groupId}/expenses`).push().set({
                description: desc,
                amount: amount,
                payerId: payer,
                participantIds: participants,
                splits: splits,
                splitType: splitType,
                date: Date.now()
            });
            
            state.showAddExpense = false;
        }
        window.addExpense = addExpense;

        function removeExpense(id) {
            db.ref(`groups/${state.groupId}/expenses/${id}`).remove();
        }
        window.removeExpense = removeExpense;

        function toggleSettlement() {
            state.showSettlement = !state.showSettlement;
            render();
        }
        window.toggleSettlement = toggleSettlement;

        function toggleRecordPayment() {
            state.showRecordPayment = !state.showRecordPayment;
            render();
        }
        window.toggleRecordPayment = toggleRecordPayment;

        function toggleExpDetails(id) {
            const details = document.getElementById('exp-details-' + id);
            if (details) {
                details.classList.toggle('hidden');
            }
        }
        window.toggleExpDetails = toggleExpDetails;

        function recordPayment() {
            const from = document.getElementById('paymentFrom').value;
            const to = document.getElementById('paymentTo').value;
            const amount = parseFloat(document.getElementById('paymentAmount').value);

            if (!from || !to || !amount || from === to) {
                alert('Please fill in all fields correctly');
                return;
            }

            db.ref(`groups/${state.groupId}/payments`).push().set({
                from: from,
                to: to,
                amount: amount,
                date: Date.now()
            });

            state.showRecordPayment = false;
        }
        window.recordPayment = recordPayment;

        function removePayment(id) {
            if (confirm('Remove this payment record?')) {
                db.ref(`groups/${state.groupId}/payments/${id}`).remove();
            }
        }
        window.removePayment = removePayment;

        // Calculations
        function calculateBalances() {
            const balances = {};
            state.friends.forEach(f => balances[f.id] = 0);
            
            // Add expenses
            state.expenses.forEach(exp => {
                // Payer gets credited the full amount
                balances[exp.payerId] = (balances[exp.payerId] || 0) + exp.amount;
                
                // Each participant pays their share
                if (exp.splits) {
                    // Use custom splits if available
                    exp.participantIds.forEach(id => {
                        balances[id] = (balances[id] || 0) - (exp.splits[id] || 0);
                    });
                } else {
                    // Fallback to equal split for old expenses
                    const share = exp.amount / exp.participantIds.length;
                    exp.participantIds.forEach(id => {
                        balances[id] = (balances[id] || 0) - share;
                    });
                }
            });
            
            // Subtract payments (when someone pays back)
            state.payments.forEach(payment => {
                balances[payment.from] = (balances[payment.from] || 0) + payment.amount; // Payer gets credited
                balances[payment.to] = (balances[payment.to] || 0) - payment.amount; // Receiver gets debited
            });
            
            return balances;
        }

        function calculateSettlements(balances) {
            const settlements = [];
            let debtors = [], creditors = [];

            Object.entries(balances).forEach(([id, bal]) => {
                if (bal < -0.01) debtors.push({ id, amount: -bal });
                else if (bal > 0.01) creditors.push({ id, amount: bal });
            });

            debtors.sort((a, b) => b.amount - a.amount);
            creditors.sort((a, b) => b.amount - a.amount);

            let i = 0, j = 0;
            while (i < debtors.length && j < creditors.length) {
                const amt = Math.min(debtors[i].amount, creditors[j].amount);
                settlements.push({ from: debtors[i].id, to: creditors[j].id, amount: amt });
                debtors[i].amount -= amt;
                creditors[j].amount -= amt;
                if (debtors[i].amount < 0.01) i++;
                if (creditors[j].amount < 0.01) j++;
            }
            return settlements;
        }

        function getFriendName(id) {
            const friend = state.friends.find(f => f.id === id);
            return friend ? friend.name : 'Unknown';
        }

        // Initialize
        const saved = localStorage.getItem('billSplitterGroupId');
        if (saved) {
            state.groupInput = saved;
            joinGroup();
        } else {
            render();
        }
        }

        // Start when Firebase is ready
        initWhenReady();
    </script>
</body>
</html>
